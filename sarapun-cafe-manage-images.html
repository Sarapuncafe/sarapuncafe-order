<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>สาระพัน Cafe — จัดการรูปภาพ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+Thambi+2:wght@500;600;700&family=Noto+Sans+Thai:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #FAF8F2;
    --cream-deep: #F1EDE2;
    --ink: #3B3B32;
    --ink-soft: #83816F;
    --olive: #606D47;
    --olive-deep: #4B5638;
    --leaf: #A7C285;
    --line: rgba(59,59,50,0.13);
    --disabled: #C9C6BA;
    --amber: #C98A3A;
    --green-ok: #4B7A4E;
    --red-err: #B5482F;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { background: var(--cream-deep); color: var(--ink); font-family: 'Noto Sans Thai', sans-serif; font-weight: 300;
    min-height: 100vh; -webkit-overflow-scrolling: touch; padding-bottom: 60px; }
  header { position: sticky; top: 0; z-index: 10; background: var(--olive); color: var(--cream);
    padding: 14px 20px; box-shadow: 0 3px 14px rgba(75,86,56,0.25); }
  .hdr-title { font-family: 'Baloo Thambi 2', sans-serif; font-weight: 600; font-size: 17px; letter-spacing: 0.02em; }
  .hdr-sub { font-size: 12px; opacity: 0.8; margin-top: 2px; }
  .tab-bar { background: var(--cream); border-bottom: 1px solid var(--line); display: flex; padding: 0 20px; gap: 4px;
    position: sticky; top: 62px; z-index: 9; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .tab-btn { background: none; border: none; padding: 13px 14px; font-family: 'Baloo Thambi 2', sans-serif; font-weight: 600;
    font-size: 13.5px; color: var(--ink-soft); cursor: pointer; border-bottom: 3px solid transparent; white-space: nowrap; }
  .tab-btn.active { color: var(--olive-deep); border-bottom-color: var(--olive); }
  main { padding: 18px 20px 40px; max-width: 960px; margin: 0 auto; }
  .status-msg { text-align: center; color: var(--ink-soft); padding: 40px 20px; font-size: 14px; }
  .status-msg.err { color: var(--red-err); }
  .item-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; }
  .item-card { background: #fff; border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
    box-shadow: 0 2px 8px rgba(59,59,50,0.06); display: flex; flex-direction: column; }
  .item-thumb-wrap { position: relative; width: 100%; aspect-ratio: 1 / 1; background: var(--cream-deep); }
  .item-thumb { width: 100%; height: 100%; object-fit: cover; display: block; }
  .item-thumb-placeholder { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
    color: var(--disabled); font-size: 30px; }
  .item-progress-overlay { position: absolute; inset: 0; background: rgba(59,59,50,0.55); color: #fff;
    display: none; flex-direction: column; align-items: center; justify-content: center; font-size: 12px;
    font-family: 'JetBrains Mono', monospace; gap: 6px; text-align: center; padding: 8px; }
  .item-progress-overlay.show { display: flex; }
  .item-body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .item-name { font-size: 13px; font-weight: 500; line-height: 1.35; }
  .item-meta { font-size: 11px; color: var(--ink-soft); }
  .btn-change { margin-top: auto; background: var(--cream-deep); border: 1px solid var(--line); color: var(--ink);
    border-radius: 100px; padding: 8px 10px; font-family: 'Noto Sans Thai', sans-serif; font-weight: 500;
    font-size: 12px; cursor: pointer; }
  .btn-change:active { background: var(--line); }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: #fff;
    padding: 10px 18px; border-radius: 100px; font-size: 13px; box-shadow: 0 6px 18px rgba(0,0,0,0.2); z-index: 50;
    opacity: 0; pointer-events: none; transition: opacity 0.2s; }
  .toast.show { opacity: 1; }
  .toast.err { background: var(--red-err); }
  .toast.ok { background: var(--green-ok); }
  .refresh-btn { background: none; border: 1px solid rgba(250,248,242,0.4); color: var(--cream); border-radius: 100px;
    padding: 6px 12px; font-size: 12px; font-family: 'Noto Sans Thai', sans-serif; cursor: pointer; margin-top: 8px; }
  .add-btn { display: block; width: 100%; background: var(--olive); color: var(--cream); border: none;
    border-radius: 12px; padding: 13px 16px; font-family: 'Baloo Thambi 2', sans-serif; font-weight: 600;
    font-size: 14px; cursor: pointer; margin-bottom: 20px; }
  .add-btn:active { background: var(--olive-deep); }
  .category-section { margin-bottom: 26px; }
  .category-header { font-family: 'Baloo Thambi 2', sans-serif; font-weight: 600; font-size: 15px;
    color: var(--olive-deep); margin-bottom: 10px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
  .modal-overlay { position: fixed; inset: 0; background: rgba(59,59,50,0.45); z-index: 60;
    display: flex; align-items: flex-end; justify-content: center; }
  @media (min-width: 640px) { .modal-overlay { align-items: center; } }
  .modal-card { background: var(--cream); width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto;
    border-radius: 18px 18px 0 0; padding: 20px; }
  @media (min-width: 640px) { .modal-card { border-radius: 18px; } }
  .modal-title { font-family: 'Baloo Thambi 2', sans-serif; font-weight: 600; font-size: 17px; margin-bottom: 16px; }
  .f-label { display: block; font-size: 12.5px; color: var(--ink-soft); margin: 14px 0 6px; }
  .f-input { width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 11px 13px; font-size: 14px;
    font-family: 'Noto Sans Thai', sans-serif; background: #fff; color: var(--ink); }
  .f-row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .f-check { display: flex; align-items: center; gap: 8px; font-size: 13.5px; margin-top: 10px; cursor: pointer; }
  .f-check input[type="checkbox"] { outline: none; }
  .f-check input[type="checkbox"]:focus, .f-check input[type="checkbox"]:focus-visible { outline: none; box-shadow: none; }
  .f-addon-list { display: flex; flex-direction: column; gap: 2px; max-height: 140px; overflow-y: auto;
    border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; background: #fff; }
  .modal-error { color: var(--red-err); font-size: 12.5px; margin-top: 12px; }
  .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
  .btn-cancel { flex: 1; background: transparent; border: 1px solid var(--line); color: var(--ink-soft);
    border-radius: 100px; padding: 12px; font-family: 'Noto Sans Thai', sans-serif; font-weight: 500; font-size: 13.5px;
    cursor: pointer; }
  .btn-save { flex: 2; background: var(--olive); border: none; color: var(--cream); border-radius: 100px;
    padding: 12px; font-family: 'Baloo Thambi 2', sans-serif; font-weight: 600; font-size: 13.5px; cursor: pointer; }
  .btn-save:disabled { background: var(--disabled); cursor: default; }
  .option-list { display: flex; flex-direction: column; gap: 8px; }
  .option-row { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px;
    display: flex; align-items: center; justify-content: space-between; gap: 10px; box-shadow: 0 2px 8px rgba(59,59,50,0.06); }
  .option-name { font-size: 13.5px; font-weight: 500; }
  .option-price { font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--ink-soft); white-space: nowrap; }
  .option-soldout { font-size: 11px; color: var(--red-err); margin-left: 6px; }
</style>
</head>
<body>

<header>
  <div class="hdr-title">สาระพัน Cafe · จัดการเมนู</div>
  <div class="hdr-sub">เปลี่ยนรูป/เพิ่มเมนู/ของรางวัล/ตัวเลือกต่างๆ — ไม่ต้องเข้า Google Sheet</div>
  <button class="refresh-btn" id="refreshBtn" onclick="loadCurrentTab()">↻ รีเฟรช</button>
</header>

<div class="tab-bar">
  <button class="tab-btn active" data-tab="menu" onclick="switchTab('menu')">เมนูเครื่องดื่ม</button>
  <button class="tab-btn" data-tab="reward" onclick="switchTab('reward')">ของรางวัล</button>
  <button class="tab-btn" data-tab="milk" onclick="switchTab('milk')">Milk Choice</button>
  <button class="tab-btn" data-tab="addon" onclick="switchTab('addon')">Add-on</button>
</div>

<main>
  <div id="menuPane"></div>
  <div id="rewardPane" style="display:none;"></div>
  <div id="milkPane" style="display:none;"></div>
  <div id="addonPane" style="display:none;"></div>
</main>

<div class="toast" id="toast"></div>

<input type="file" id="fileInput" accept="image/*" style="display:none;">

<script>
const MENU_API_URL = new URLSearchParams(window.location.search).get('api') ||
  "https://script.google.com/macros/s/AKfycbzmI1E3GDjhHXV1hdHnWbKdn7gjBXQf9pTqdpy0uWB74dO9JF49ciXKE0FsaMocZc__/exec";

let currentTab = 'menu';
let menuItems = [];
let rewardItems = [];
let currentAddons = [];
let currentRoastOptions = [];
let currentMilkOptions = [];
let pendingTarget = null; // { type: 'menu'|'reward', key, cardEl, thumbWrap }

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
  });
}

function showToast(msg, kind) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (kind ? ' ' + kind : '');
  clearTimeout(showToast._timer);
  showToast._timer = setTimeout(() => { t.className = 'toast'; }, 3200);
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  ['menu', 'reward', 'milk', 'addon'].forEach(t => {
    document.getElementById(t + 'Pane').style.display = t === tab ? '' : 'none';
  });
  loadCurrentTab();
}

function loadCurrentTab() {
  if (currentTab === 'menu') loadMenuItems();
  else if (currentTab === 'reward') loadRewardItems();
  else if (currentTab === 'milk') loadOptionList('milk', 'milkPane', 'Milk Choice');
  else if (currentTab === 'addon') loadOptionList('addon', 'addonPane', 'Add-on');
}

// ---------- JSONP helper (แบบเดียวกับที่ใช้ทั่วทั้งระบบ กันปัญหา CORS) ----------
function jsonpRequest(params, timeoutMs) {
  return new Promise((resolve) => {
    const cbName = 'cb_' + Date.now() + '_' + Math.random().toString(36).slice(2);
    let done = false;
    const finish = (res) => {
      if (done) return;
      done = true;
      clearTimeout(timer);
      delete window[cbName];
      if (scriptEl.parentNode) scriptEl.parentNode.removeChild(scriptEl);
      resolve(res);
    };
    const timer = setTimeout(() => finish(null), timeoutMs || 15000);
    window[cbName] = (res) => finish(res);
    const scriptEl = document.createElement('script');
    const qs = Object.keys(params).map(k => k + '=' + encodeURIComponent(params[k])).join('&');
    scriptEl.src = MENU_API_URL + '?' + qs + '&callback=' + cbName;
    scriptEl.onerror = () => finish(null);
    document.body.appendChild(scriptEl);
  });
}

// ---------- โหลดรายชื่อเมนูเครื่องดื่ม (ใช้ action=getMenuManage เดิมที่มีอยู่แล้ว มีรูปภาพติดมาด้วย) ----------
// จัดกลุ่มตาม "หมวดหมู่" ให้อัตโนมัติ (เรียงตามลำดับที่เจอก่อน-หลังในชีต) พร้อมปุ่มเพิ่มเมนูใหม่ด้านบน
async function loadMenuItems() {
  const pane = document.getElementById('menuPane');
  pane.innerHTML = '<div class="status-msg">กำลังโหลด...</div>';
  const res = await jsonpRequest({ action: 'getMenuManage' });
  if (!res || !res.ok) {
    pane.innerHTML = '<div class="status-msg err">โหลดรายการเมนูไม่สำเร็จ ลองกดรีเฟรชอีกครั้งค่ะ</div>';
    return;
  }
  menuItems = res.items || [];
  currentAddons = res.addons || [];
  currentMilkOptions = res.milkOptions || [];
  currentRoastOptions = res.roastOptions || [];

  pane.innerHTML = '';
  const addBtn = document.createElement('button');
  addBtn.className = 'add-btn';
  addBtn.textContent = '+ เพิ่มเมนูใหม่ / กลุ่มใหม่';
  addBtn.onclick = openAddMenuModal;
  pane.appendChild(addBtn);

  if (menuItems.length === 0) {
    const msg = document.createElement('div');
    msg.className = 'status-msg';
    msg.textContent = 'ยังไม่มีเมนูเลยค่ะ';
    pane.appendChild(msg);
    return;
  }

  const categoryOrder = [];
  const byCategory = {};
  menuItems.forEach(it => {
    const cat = it.category || 'ไม่ระบุหมวดหมู่';
    if (!byCategory[cat]) { byCategory[cat] = []; categoryOrder.push(cat); }
    byCategory[cat].push(it);
  });

  categoryOrder.forEach(cat => {
    const section = document.createElement('div');
    section.className = 'category-section';
    const header = document.createElement('div');
    header.className = 'category-header';
    header.textContent = cat;
    section.appendChild(header);
    const grid = document.createElement('div');
    grid.className = 'item-grid';
    byCategory[cat].forEach(it => grid.appendChild(buildCard({
      type: 'menu',
      key: it.nameTh,
      name: it.nameTh + (it.name ? ' (' + it.name + ')' : ''),
      meta: it.soldOut ? 'ปิดขายอยู่' : 'เปิดขายอยู่',
      image: it.image || '',
    })));
    section.appendChild(grid);
    pane.appendChild(section);
  });
}

// ---------- โหลดรายชื่อของรางวัล CRM (action=getRewardsManage ใหม่) พร้อมปุ่มเพิ่มของรางวัลใหม่ด้านบน ----------
async function loadRewardItems() {
  const pane = document.getElementById('rewardPane');
  pane.innerHTML = '<div class="status-msg">กำลังโหลด...</div>';
  const res = await jsonpRequest({ action: 'getRewardsManage' });
  if (!res || !res.ok) {
    pane.innerHTML = '<div class="status-msg err">โหลดรายการของรางวัลไม่สำเร็จ ลองกดรีเฟรชอีกครั้งค่ะ</div>';
    return;
  }
  rewardItems = res.rewards || [];

  pane.innerHTML = '';
  const addBtn = document.createElement('button');
  addBtn.className = 'add-btn';
  addBtn.textContent = '+ เพิ่มของรางวัลใหม่';
  addBtn.onclick = openAddRewardModal;
  pane.appendChild(addBtn);

  if (rewardItems.length === 0) {
    const msg = document.createElement('div');
    msg.className = 'status-msg';
    msg.textContent = 'ยังไม่มีของรางวัลเลยค่ะ';
    pane.appendChild(msg);
    return;
  }

  const grid = document.createElement('div');
  grid.className = 'item-grid';
  rewardItems.forEach(r => grid.appendChild(buildCard({
    type: 'reward',
    key: r.id,
    name: r.name,
    meta: r.pointsCost + ' แต้ม' + (r.enabled ? '' : ' · ปิดใช้งานอยู่'),
    image: r.image || '',
  })));
  pane.appendChild(grid);
}

// ---------- โหลดรายการ Milk Choice / Add-on (ไม่มีรูปภาพ แค่ชื่อ+ราคา ใช้ action=getMenuManage เดิม) ----------
// listType: 'milk' หรือ 'addon' — ใช้ทั้งดึงรายการมาแสดง และส่งไปกับ action=addOption ตอนเพิ่มรายการใหม่
async function loadOptionList(listType, paneId, title) {
  const pane = document.getElementById(paneId);
  pane.innerHTML = '<div class="status-msg">กำลังโหลด...</div>';
  const res = await jsonpRequest({ action: 'getMenuManage' });
  if (!res || !res.ok) {
    pane.innerHTML = '<div class="status-msg err">โหลดรายการไม่สำเร็จ ลองกดรีเฟรชอีกครั้งค่ะ</div>';
    return;
  }
  const list = listType === 'milk' ? (res.milkOptions || []) : (res.addons || []);

  pane.innerHTML = '';
  const addBtn = document.createElement('button');
  addBtn.className = 'add-btn';
  addBtn.textContent = '+ เพิ่มรายการใหม่ใน ' + title;
  addBtn.onclick = () => openAddOptionModal(listType, title);
  pane.appendChild(addBtn);

  if (list.length === 0) {
    const msg = document.createElement('div');
    msg.className = 'status-msg';
    msg.textContent = 'ยังไม่มีรายการเลยค่ะ';
    pane.appendChild(msg);
    return;
  }

  const listEl = document.createElement('div');
  listEl.className = 'option-list';
  list.forEach(opt => {
    const row = document.createElement('div');
    row.className = 'option-row';
    row.innerHTML =
      '<span class="option-name">' + escapeHtml(opt.label) + (opt.soldOut ? '<span class="option-soldout">ปิดขายอยู่</span>' : '') + '</span>' +
      '<span class="option-price">+' + opt.price + ' บาท</span>';
    listEl.appendChild(row);
  });
  pane.appendChild(listEl);
}

function buildCard(it) {
  const card = document.createElement('div');
  card.className = 'item-card';

  const thumbWrap = document.createElement('div');
  thumbWrap.className = 'item-thumb-wrap';
  if (it.image) {
    const img = document.createElement('img');
    img.className = 'item-thumb';
    img.src = it.image;
    img.alt = it.name;
    thumbWrap.appendChild(img);
  } else {
    const ph = document.createElement('div');
    ph.className = 'item-thumb-placeholder';
    ph.textContent = '🖼️';
    thumbWrap.appendChild(ph);
  }
  const overlay = document.createElement('div');
  overlay.className = 'item-progress-overlay';
  overlay.innerHTML = '<div>กำลังอัปโหลด...</div><div class="pct">0%</div>';
  thumbWrap.appendChild(overlay);
  card.appendChild(thumbWrap);

  const body = document.createElement('div');
  body.className = 'item-body';
  const nameEl = document.createElement('div');
  nameEl.className = 'item-name';
  nameEl.textContent = it.name;
  body.appendChild(nameEl);
  const metaEl = document.createElement('div');
  metaEl.className = 'item-meta';
  metaEl.textContent = it.meta;
  body.appendChild(metaEl);

  const btn = document.createElement('button');
  btn.className = 'btn-change';
  btn.textContent = 'เปลี่ยนรูป';
  btn.onclick = () => {
    pendingTarget = { type: it.type, key: it.key, thumbWrap, overlay };
    document.getElementById('fileInput').value = '';
    document.getElementById('fileInput').click();
  };
  body.appendChild(btn);

  card.appendChild(body);
  return card;
}

document.getElementById('fileInput').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file || !pendingTarget) return;
  const target = pendingTarget;
  pendingTarget = null;
  target.overlay.classList.add('show');
  target.overlay.querySelector('.pct').textContent = 'กำลังเตรียมรูป...';
  try {
    const newUrl = await uploadImage(file, target.type, target.key, (pct) => {
      target.overlay.querySelector('.pct').textContent = pct + '%';
    });
    target.thumbWrap.innerHTML = '';
    const img = document.createElement('img');
    img.className = 'item-thumb';
    img.src = newUrl + '&t=' + Date.now(); // กัน cache รูปเก่าค้าง
    target.thumbWrap.appendChild(img);
    const overlay = document.createElement('div');
    overlay.className = 'item-progress-overlay';
    overlay.innerHTML = '<div>กำลังอัปโหลด...</div><div class="pct">0%</div>';
    target.thumbWrap.appendChild(overlay);
    showToast('เปลี่ยนรูปสำเร็จแล้วค่ะ', 'ok');
  } catch (err) {
    target.overlay.classList.remove('show');
    showToast(err.message || 'เปลี่ยนรูปไม่สำเร็จ ลองใหม่อีกครั้งค่ะ', 'err');
  }
});

// ---------- บีบอัดรูปด้วย canvas ก่อนส่ง (ลดขนาดไฟล์ ลดจำนวนชิ้นที่ต้องอัปโหลด) ----------
function compressImage(file, maxDim, quality) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('อ่านไฟล์รูปไม่สำเร็จ'));
    reader.onload = (e) => {
      const img = new Image();
      img.onerror = () => reject(new Error('เปิดไฟล์รูปไม่สำเร็จ (ไฟล์อาจไม่ใช่รูปภาพ)'));
      img.onload = () => {
        let { width, height } = img;
        if (width > maxDim || height > maxDim) {
          if (width > height) { height = Math.round(height * maxDim / width); width = maxDim; }
          else { width = Math.round(width * maxDim / height); height = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

// ---------- อัปโหลดรูป: บีบอัด -> ตัดเป็นชิ้นเล็กๆ -> ส่งทีละชิ้น -> commit ประกอบรวมที่เซิร์ฟเวอร์ ----------
async function uploadImage(file, targetType, targetKey, onProgress) {
  const dataUrl = await compressImage(file, 800, 0.7);
  const base64 = dataUrl.split(',')[1];
  const mimeType = 'image/jpeg';
  const chunkSize = 6000;
  const chunks = [];
  for (let i = 0; i < base64.length; i += chunkSize) chunks.push(base64.slice(i, i + chunkSize));

  const uploadId = 'img_' + Date.now() + '_' + Math.random().toString(36).slice(2);
  for (let i = 0; i < chunks.length; i++) {
    const res = await jsonpRequest({ action: 'uploadImageChunk', uploadId, index: i, data: chunks[i] });
    if (!res || !res.ok) throw new Error('ส่งข้อมูลรูปไม่สำเร็จ ลองใหม่อีกครั้งค่ะ');
    if (onProgress) onProgress(Math.round(((i + 1) / (chunks.length + 1)) * 100));
  }

  const commitRes = await jsonpRequest({
    action: 'commitImageUpload',
    uploadId,
    total: chunks.length,
    targetType,
    targetKey,
    mimeType,
  }, 30000);
  if (onProgress) onProgress(100);
  if (!commitRes || !commitRes.ok) throw new Error((commitRes && commitRes.error) || 'บันทึกรูปไม่สำเร็จ ลองใหม่อีกครั้งค่ะ');
  return commitRes.image;
}

function openAddMenuModal() {

  menuItems.forEach(it => { if (it.category && categories.indexOf(it.category) === -1) categories.push(it.category); });

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML =
    '<div class="modal-card">' +
      '<div class="modal-title">เพิ่มเมนูใหม่</div>' +
      '<label class="f-label">กลุ่มสินค้า</label>' +
      '<select class="f-input" id="amCategory">' +
        categories.map(c => '<option value="' + escapeHtml(c) + '">' + escapeHtml(c) + '</option>').join('') +
        '<option value="__new__">+ กลุ่มใหม่...</option>' +
      '</select>' +
      '<input class="f-input" id="amCategoryNew" placeholder="พิมพ์ชื่อกลุ่มใหม่" style="display:none;margin-top:8px;">' +
      '<label class="f-label">ชื่อเมนู (ไทย) *</label>' +
      '<input class="f-input" id="amNameTh" placeholder="เช่น อเมริกาโน่">' +
      '<label class="f-label">ชื่อเมนู (อังกฤษ)</label>' +
      '<input class="f-input" id="amNameEn" placeholder="ไม่บังคับ">' +
      '<label class="f-label">ราคา (เว้นว่าง = ไม่มีแบบนั้น)</label>' +
      '<div class="f-row3">' +
        '<input class="f-input" id="amPriceHot" type="number" inputmode="numeric" placeholder="ร้อน">' +
        '<input class="f-input" id="amPriceIce" type="number" inputmode="numeric" placeholder="เย็น">' +
        '<input class="f-input" id="amPriceFrappe" type="number" inputmode="numeric" placeholder="ปั่น">' +
      '</div>' +
      (currentRoastOptions.length
        ? '<label class="f-label">ระดับคั่วที่ใช้ได้</label><div class="f-addon-list">' +
          currentRoastOptions.map(r => '<label class="f-check"><input type="checkbox" class="am-roast" value="' +
            escapeHtml(r.label) + '"> ' + escapeHtml(r.label) + '</label>').join('') + '</div>'
        : '<div class="f-label">ยังไม่มีรายการในระดับคั่ว — ไปเพิ่มที่ชีต "ระดับคั่ว" ก่อนได้ค่ะ</div>') +
      (currentMilkOptions.length
        ? '<label class="f-label">Milk Choice ที่ใช้ได้</label><div class="f-addon-list">' +
          currentMilkOptions.map(m => '<label class="f-check"><input type="checkbox" class="am-milk" value="' +
            escapeHtml(m.label) + '"> ' + escapeHtml(m.label) + '</label>').join('') + '</div>'
        : '<div class="f-label">ยังไม่มีรายการใน Milk Choice — ไปเพิ่มที่แท็บ "Milk Choice" ก่อนได้ค่ะ</div>') +
      (currentAddons.length
        ? '<label class="f-label">Add-on ที่ใช้ได้</label><div class="f-addon-list">' +
          currentAddons.map(a => '<label class="f-check"><input type="checkbox" class="am-addon" value="' +
            escapeHtml(a.label) + '"> ' + escapeHtml(a.label) + '</label>').join('') + '</div>'
        : '') +
      '<div class="modal-error" id="amError" style="display:none;"></div>' +
      '<div class="modal-actions">' +
        '<button class="btn-cancel" id="amCancel">ยกเลิก</button>' +
        '<button class="btn-save" id="amSave">บันทึก</button>' +
      '</div>' +
    '</div>';
  document.body.appendChild(overlay);

  const catSelect = overlay.querySelector('#amCategory');
  const catNewInput = overlay.querySelector('#amCategoryNew');
  catSelect.addEventListener('change', () => {
    catNewInput.style.display = catSelect.value === '__new__' ? '' : 'none';
  });

  overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
  overlay.querySelector('#amCancel').onclick = () => overlay.remove();

  overlay.querySelector('#amSave').onclick = async () => {
    const errEl = overlay.querySelector('#amError');
    errEl.style.display = 'none';
    const category = catSelect.value === '__new__' ? catNewInput.value.trim() : catSelect.value;
    const nameTh = overlay.querySelector('#amNameTh').value.trim();
    if (!category) { errEl.textContent = 'กรอกชื่อกลุ่มสินค้าด้วยค่ะ'; errEl.style.display = ''; return; }
    if (!nameTh) { errEl.textContent = 'กรอกชื่อเมนู (ไทย) ด้วยค่ะ'; errEl.style.display = ''; return; }

    const nameEn = overlay.querySelector('#amNameEn').value.trim();
    const priceHot = overlay.querySelector('#amPriceHot').value.trim();
    const priceIce = overlay.querySelector('#amPriceIce').value.trim();
    const priceFrappe = overlay.querySelector('#amPriceFrappe').value.trim();
    const addons = Array.from(overlay.querySelectorAll('.am-addon:checked')).map(el => el.value).join(',');
    const milkNamesArr = Array.from(overlay.querySelectorAll('.am-milk:checked')).map(el => el.value);
    const roastNamesArr = Array.from(overlay.querySelectorAll('.am-roast:checked')).map(el => el.value);
    const milkNames = milkNamesArr.join(',');
    const roastNames = roastNamesArr.join(',');
    // ไม่มีช่องติ๊ก "มีตัวเลือก..." แยกแล้ว (เหมือน Add-on ที่ไม่มีช่องนี้เช่นกัน) — ติ๊กเลือกรายการในลิสต์ไหน
    // ก็ถือว่าเมนูนี้ "มีตัวเลือกนั้น" ไปเลย ไม่ติ๊กเลย = เมนูนี้ไม่มีตัวเลือกนั้น
    const roast = roastNamesArr.length > 0 ? 'Y' : 'N';
    const milk = milkNamesArr.length > 0 ? 'Y' : 'N';

    const saveBtn = overlay.querySelector('#amSave');
    saveBtn.disabled = true;
    saveBtn.textContent = 'กำลังบันทึก...';

    const res = await jsonpRequest({
      action: 'addMenuItem', category, nameTh, nameEn, priceHot, priceIce, priceFrappe, roast, milk, addons, milkNames, roastNames,
    });

    if (!res || !res.ok) {
      errEl.textContent = (res && res.error) || 'บันทึกไม่สำเร็จ ลองใหม่อีกครั้งค่ะ';
      errEl.style.display = '';
      saveBtn.disabled = false;
      saveBtn.textContent = 'บันทึก';
      return;
    }

    overlay.remove();
    showToast('เพิ่มเมนู "' + nameTh + '" แล้วค่ะ กดปุ่ม "เปลี่ยนรูป" ที่เมนูนี้เพื่อใส่รูปได้เลย', 'ok');
    loadMenuItems();
  };
}

      '</div>' +
    '</div>';
  document.body.appendChild(overlay);

  overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
  overlay.querySelector('#arCancel').onclick = () => overlay.remove();

  overlay.querySelector('#arSave').onclick = async () => {
    const errEl = overlay.querySelector('#arError');
    errEl.style.display = 'none';
    const name = overlay.querySelector('#arName').value.trim();
    const pointsCost = overlay.querySelector('#arPoints').value.trim();

    if (!pointsCost || Number(pointsCost) <= 0) { errEl.textContent = 'กรอกแต้มที่ต้องใช้แลกให้ถูกต้องด้วยค่ะ'; errEl.style.display = ''; return; }
    const description = overlay.querySelector('#arDesc').value.trim();

    const saveBtn = overlay.querySelector('#arSave');
    saveBtn.disabled = true;
    saveBtn.textContent = 'กำลังบันทึก...';

    const res = await jsonpRequest({ action: 'addReward', name, pointsCost, description });

    if (!res || !res.ok) {
      errEl.textContent = (res && res.error) || 'บันทึกไม่สำเร็จ ลองใหม่อีกครั้งค่ะ';
      errEl.style.display = '';
      saveBtn.disabled = false;
      saveBtn.textContent = 'บันทึก';
      return;
    }

    overlay.remove();
    showToast('เพิ่มของรางวัล "' + name + '" แล้วค่ะ (รหัส ' + res.id + ') กดปุ่ม "เปลี่ยนรูป" เพื่อใส่รูปได้เลย', 'ok');
    loadRewardItems();
  };
}

// ---------- โมดัล "เพิ่มรายการใหม่" สำหรับ Milk Choice / Add-on ----------
function openAddOptionModal(listType, title) {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML =
    '<div class="modal-card">' +
      '<div class="modal-title">เพิ่มรายการใหม่ใน ' + escapeHtml(title) + '</div>' +
      '<label class="f-label">ชื่อรายการ *</label>' +
      '<input class="f-input" id="aoName" placeholder="เช่น นมข้าวโอ๊ต">' +
      '<label class="f-label">ราคาเพิ่ม (บาท) *</label>' +
      '<input class="f-input" id="aoPrice" type="number" inputmode="numeric" placeholder="เช่น 15 (ใส่ 0 ได้ถ้าไม่มีราคาเพิ่ม)">' +
      '<div class="modal-error" id="aoError" style="display:none;"></div>' +
      '<div class="modal-actions">' +
        '<button class="btn-cancel" id="aoCancel">ยกเลิก</button>' +
        '<button class="btn-save" id="aoSave">บันทึก</button>' +
      '</div>' +
    '</div>';
  document.body.appendChild(overlay);

  overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
  overlay.querySelector('#aoCancel').onclick = () => overlay.remove();

  overlay.querySelector('#aoSave').onclick = async () => {
    const errEl = overlay.querySelector('#aoError');
    errEl.style.display = 'none';
    const name = overlay.querySelector('#aoName').value.trim();
    const price = overlay.querySelector('#aoPrice').value.trim();
    if (!name) { errEl.textContent = 'กรอกชื่อรายการด้วยค่ะ'; errEl.style.display = ''; return; }
    if (price === '' || isNaN(Number(price))) { errEl.textContent = 'กรอกราคาให้ถูกต้องด้วยค่ะ'; errEl.style.display = ''; return; }

    const saveBtn = overlay.querySelector('#aoSave');
    saveBtn.disabled = true;
    saveBtn.textContent = 'กำลังบันทึก...';

    const res = await jsonpRequest({ action: 'addOption', list: listType, name, price });

    if (!res || !res.ok) {
      errEl.textContent = (res && res.error) || 'บันทึกไม่สำเร็จ ลองใหม่อีกครั้งค่ะ';
      errEl.style.display = '';
      saveBtn.disabled = false;
      saveBtn.textContent = 'บันทึก';
      return;
    }

    overlay.remove();
    showToast('เพิ่ม "' + name + '" ใน ' + title + ' แล้วค่ะ', 'ok');
    loadOptionList(listType, listType === 'milk' ? 'milkPane' : 'addonPane', title);
  };
}
